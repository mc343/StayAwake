name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish
      run: |
        cd src
        dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ../publish

    - name: Create Zip
      run: |
        cd publish
        7z a -tzip ../StayAwake-win-x64.zip *
        cd ..

    - name: Create Source ZIP
      run: |
        Compress-Archive -Path * -DestinationPath StayAwake-source.zip -Force -CompressionLevel Optimal -Exclude 'publish','*.zip','.git','.github','*obj','*bin','DOWNLOAD_NOTES.md','build-*.ps1','create-*.ps1','sign-*.ps1'

    - name: Generate Release Notes
      id: release_notes
      run: |
        "## ⏰ StayAwake ${{ github.ref_name }}" | Out-File -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "---" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### 🛡️ IMPORTANT: Windows SmartScreen Warning" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "**When you run StayAwake for the first time, you WILL see this warning:**" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "> ❌ **'Windows protected your PC'**" | Out-File -Append -Encoding UTF8 release-notes.md
        "> 'Windows Defender SmartScreen prevented an unrecognized app from starting.'" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "**This is 100% NORMAL and SAFE!**" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### What to do:" | Out-File -Append -Encoding UTF8 release-notes.md
        "1. Click **'More info'**" | Out-File -Append -Encoding UTF8 release-notes.md
        "2. Click **'Run anyway'**" | Out-File -Append -Encoding UTF8 release-notes.md
        "3. Done! The warning will never appear again" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### Why does this happen?" | Out-File -Append -Encoding UTF8 release-notes.md
        "StayAwake is a new open-source app that hasn't built up reputation with Microsoft yet." | Out-File -Append -Encoding UTF8 release-notes.md
        "The warning automatically disappears as more people run StayAwake. **This is NOT a virus or malware.**" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### Want to avoid this completely?" | Out-File -Append -Encoding UTF8 release-notes.md
        "Build StayAwake yourself! See the build guides below 👇" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "---" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### 📥 Downloads" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "| File | Description | SmartScreen Warning |" | Out-File -Append -Encoding UTF8 release-notes.md
        "|------|-------------|---------------------|" | Out-File -Append -Encoding UTF8 release-notes.md
        "| **StayAwake-win-x64.zip** | Pre-built executable (ready to run) | ⚠️ Yes (first time only) |" | Out-File -Append -Encoding UTF8 release-notes.md
        "| **StayAwake-source.zip** | Source code + build script (build it yourself) | ✅ No warnings |" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "---" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### 🔨 Build Guide: Option 2 - Download ZIP & Build (Easiest, No Warnings!)" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "**Perfect if you want to avoid the SmartScreen warning without installing git!**" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "1. **Download `StayAwake-source.zip`** from this release" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "2. **Extract the ZIP file** anywhere on your computer" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "3. **Double-click `build-exe.bat`** inside the extracted folder" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "   That's it! The batch file will:" | Out-File -Append -Encoding UTF8 release-notes.md
        "   - Check if .NET 8 SDK is installed (install if needed from [dotnet.microsoft.com](https://dotnet.microsoft.com/download/dotnet/8.0))" | Out-File -Append -Encoding UTF8 release-notes.md
        "   - Build the executable for you" | Out-File -Append -Encoding UTF8 release-notes.md
        "   - Open the folder with your new `StayAwake.exe`" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "4. **Run your freshly built EXE**—no warnings, ever!" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "---" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### 🔨 Build Guide: Option 3 - Clone & Build (For Developers)" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "**For developers who want to work with the source code directly.**" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "1. **Clone the repository:**" | Out-File -Append -Encoding UTF8 release-notes.md
        "   ```bash" | Out-File -Append -Encoding UTF8 release-notes.md
        "   git clone https://github.com/mc343/StayAwake.git" | Out-File -Append -Encoding UTF8 release-notes.md
        "   cd StayAwake" | Out-File -Append -Encoding UTF8 release-notes.md
        "   ```" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "2. **Double-click `build-exe.bat`** (or run manually below)" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "**Or build manually:**" | Out-File -Append -Encoding UTF8 release-notes.md
        "   ```bash" | Out-File -Append -Encoding UTF8 release-notes.md
        "   cd src" | Out-File -Append -Encoding UTF8 release-notes.md
        "   dotnet publish -c Release -r win-x64 --self-contained" | Out-File -Append -Encoding UTF8 release-notes.md
        "   # Find the exe in: bin\Release\net8.0-windows\win-x64\StayAwake.exe" | Out-File -Append -Encoding UTF8 release-notes.md
        "   ```" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### 🔐 Verification" | Out-File -Append -Encoding UTF8 release-notes.md
        "SHA-256: ```${{ hashFiles('publish/StayAwake.exe') }```" | Out-File -Append -Encoding UTF8 release-notes.md
        "" | Out-File -Append -Encoding UTF8 release-notes.md
        "### ✅ Safety Guarantees" | Out-File -Append -Encoding UTF8 release-notes.md
        "- 📖 100% Open Source - [View full code](https://github.com/mc343/StayAwake)" | Out-File -Append -Encoding UTF8 release-notes.md
        "- 🌐 Works 100% offline - no data collected or transmitted" | Out-File -Append -Encoding UTF8 release-notes.md
        "- 🔨 Build it yourself for complete trust" | Out-File -Append -Encoding UTF8 release-notes.md
        Get-Content release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          StayAwake-win-x64.zip
          StayAwake-source.zip
        body_path: release-notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
